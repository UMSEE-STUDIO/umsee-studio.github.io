<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>UMSEE Pixel Arcade</title>
<link rel="icon" href="data:,">
<link rel="preload" href="assets/fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
<div id="device">
  <div id="langs" role="group" aria-label="language"></div>
  <div id="bezel">
    <div id="wrap">
      <canvas id="screen" width="320" height="180"></canvas>
      <div id="ui"></div>
    </div>
  </div>
  <div id="controls" aria-live="polite"></div>
  <div id="console">
    <div id="stick" aria-label="joystick"><div class="ring"></div><div class="shaft"></div><div class="knob"></div></div>
    <div class="mid">
      <div class="pills">
        <button class="pill" id="help" aria-label="help">?</button>
        <button class="pill" id="bgm" aria-label="bgm">&#9835;</button>
      </div>
      <input id="vol" type="range" min="0" max="100" aria-label="volume">
    </div>
    <div class="face">
      <button class="fb green" data-alias="help" aria-label="help">?</button>
      <button class="fb blue" data-alias="bgm" aria-label="bgm">&#9835;</button>
      <button class="fb yellow" data-btn="b" aria-label="B">B</button>
      <button class="fb red" data-btn="a" aria-label="A">A</button>
    </div>
  </div>
</div>
<script>
// Always run the newest build: read version.json past every cache, then load the style, scripts and
// data with ?v=<version>. Locally (no version.json) every reload gets a fresh timestamp.
(async () => {
  let v = String(Date.now());
  try { const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) v = (await r.json()).v; } catch { /* offline or local */ }
  window.ASSET_V = v;
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'src/style.css?v=' + v; document.head.appendChild(css);
  await new Promise(ok => { css.onload = css.onerror = ok; });
  for (const f of ['data', 'audio', 'input', 'ui', 'panels', 'scenes', 'world', 'gallery', 'career', 'main']) {
    await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = `src/${f}.js?v=${v}`; s.onload = ok; s.onerror = fail; document.body.appendChild(s); });
  }
})();
</script>
</body>
</html>
